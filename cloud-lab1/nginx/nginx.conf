worker_processes 1;
pid run/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    server_tokens off;

    # Временные файлы держим внутри проекта
    client_body_temp_path run/client_body;
    proxy_temp_path       run/proxy;
    fastcgi_temp_path     run/fastcgi;
    uwsgi_temp_path       run/uwsgi;
    scgi_temp_path        run/scgi;

    # В лог пишем, какой бэкенд обработал запрос
    log_format main '$remote_addr [$time_local] $host "$request" $status '
                    'upstream=$upstream_addr instance=$upstream_http_x_instance_id';
    access_log logs/access.log main;

    # Ограничение частоты запросов: 5 запросов/сек с одного IP, всплеск до 10 запросов, дальше — ответ 429.
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_status 429;

    # Балансировка
    upstream backend_pool {
        server 127.0.0.1:5001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:5002 max_fails=1 fail_timeout=5s;
    }

    # HTTP (80)
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS: сервер по умолчанию. Сюда попадают запросы с чужим Host
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;

        default_type text/plain;
        return 404 "Unknown host\n";
    }

    # Виртуальный хост 1: основной проект (фронт + API)
    server {
        listen 443 ssl;
        server_name lab.local;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;

        # Статику фронтенда отдаёт сам nginx
        root  frontend;
        index index.html;

        # Свои страницы ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /404.html { root errors; internal; }
        location = /50x.html { root errors; internal; }

        location / {
            try_files $uri $uri/ =404;
        }

        # /api -> один из двух бэкендов
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://backend_pool;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Отказоустойчивость
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Upstream $upstream_addr always;
        }

        # alias: URL /docs/ отдаётся из отдельной папки docs/
        location = /docs { return 301 /docs/; }
        location /docs/ {
            alias docs/;
            index index.html;
        }

        # /admin закрыт базовой авторизацией
        location = /admin { return 301 /admin/; }
        location /admin/ {
            auth_basic           "Admin area";
            auth_basic_user_file htpasswd;
            alias admin/;
            index index.html;
        }
    }

    # Виртуальный хост 2
    server {
        listen 443 ssl;
        server_name second.local;

        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root  second;
        index index.html;

        error_page 404 /404.html;
        location = /404.html { root errors; internal; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
